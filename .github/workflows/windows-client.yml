name: windows-client

# V3 Windows client: GPUI app shell + libghostty-vt + ConPTY + protocol v2 client.
# Builds clients/windows and the v2-test-server, runs the headless smoke mode
# (W1, W2 and W3 checks; W3 pairs with the test server running as a separate
# process, kills and restarts it), uploads the exe, DLLs, smoke.json and a
# screenshot of the 4-pane layout.
on:
  push:
    branches: [v3/win-spike]
    paths:
      - "clients/windows/**"
      - "crates/forgetty-vt/**"
      - "crates/forgetty-core/**"
      - "crates/forgetty-client/**"
      - "crates/forgetty-proto/**"
      - "crates/forgetty-sync/**"
      - "crates/forgetty-server/**"
      - "crates/forgetty-session/**"
      - "crates/forgetty-pty/**"
      - "crates/forgetty-socket/**"
      - "crates/forgetty-config/**"
      - "crates/forgetty-workspace/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            clients/windows
            .

      - name: Build (release)
        working-directory: clients/windows
        run: cargo build --release --locked

      - name: Build the protocol v2 test server (separate process for the W3 smoke)
        run: |
          cargo build --release --locked -p forgetty-client --features test-util --bin v2-test-server
          Copy-Item target/release/v2-test-server.exe clients/windows/target/release/
        shell: pwsh

      # forgetty.exe is the CLI and the per-user server, forgetty-win.exe is the app. They share one
      # ghostty-vt.dll (same source, same flags), which the client build above already put here.
      - name: Build forgetty.exe (the CLI and server)
        run: |
          cargo build --release --locked -p forgetty-server --bin forgetty
          Copy-Item target/release/forgetty.exe clients/windows/target/release/
        shell: pwsh

      # The same server with debug assertions on: only such a build reads FORGETTY_TEST_ALLOW_ELEVATED
      # (a release build never runs elevated), and this runner is an administrator. Everything else
      # is the release code, so the smoke measures real latency. It is a copy for the smoke only.
      - name: Build forgetty.exe that may run elevated (local server smoke only)
        run: |
          cargo build --release --locked -p forgetty-server --bin forgetty --config "profile.release.package.forgetty-server.debug-assertions=true"
          Copy-Item target/release/forgetty.exe clients/windows/target/release/forgetty-test.exe
        shell: pwsh

      - name: Unit tests (shell core, remote backend)
        working-directory: clients/windows
        run: |
          # The ConPTY tests in shell-core's local module are covered by the smoke.
          cargo test --release --locked -p forgetty-shell-core --lib -- conpty:: devices:: imagepaste:: notify:: localserver:: layout:: keys:: osc:: osc52:: fuzzy:: update:: search:: links:: copytext:: paste:: selection:: scrollbar:: bell:: codeblock:: colors:: menu:: ops:: fingerprint:: config:: argv:: confwatch:: resolve:: settings:: settings_file:: settings_ui:: shortcuts:: textarea::
          cargo test --release --locked -p forgetty-remote

      - name: Turn on the Japanese and Chinese input methods for the smoke
        # The runner image already has the language packs and Microsoft IME / Pinyin. They only
        # need to be enabled for the user, so the smoke can switch to them like the language bar.
        continue-on-error: true
        shell: pwsh
        run: |
          $list = Get-WinUserLanguageList
          foreach ($tag in 'ja-JP', 'zh-Hans-CN') { if (-not ($list | Where-Object LanguageTag -eq $tag)) { $list.Add($tag) } }
          Set-WinUserLanguageList $list -Force
          Get-WinUserLanguageList | ForEach-Object { "$($_.LanguageTag): $($_.InputMethodTips -join ' ')" }

      - name: Smoke
        shell: pwsh
        working-directory: clients/windows/target/release
        env:
          # The local server phase starts this build with its own --state-dir.
          FORGETTY_SERVER_EXE: ${{ github.workspace }}\clients\windows\target\release\forgetty-test.exe
          FORGETTY_TEST_ALLOW_ELEVATED: "1"
        run: |
          Get-ChildItem *.exe, *.dll | Format-Table Name, Length
          # The release exe is GUI-subsystem: wait for it explicitly. It attaches to this console.
          # Not -Wait: that also waits for the local server the smoke starts (a child of the app).
          $p = Start-Process .\forgetty-win.exe -ArgumentList '--smoke' -PassThru -RedirectStandardOutput smoke.json -RedirectStandardError smoke.err
          if (-not $p.WaitForExit(600000)) { Write-Host "smoke still running after 10 minutes, killing it"; $p.Kill() }
          # A server the smoke left behind would keep the runner's handles.
          Get-Process forgetty-test, forgetty -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content smoke.json
          Get-Content smoke.err
          $code = if ($p.HasExited) { $p.ExitCode } else { 1 }
          Write-Host "forgetty-win --smoke exit code: $code"
          exit $code

      - name: Upload layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgetty-win-layout-4pane
          if-no-files-found: warn
          path: |
            clients/windows/target/release/layout-4pane.png
            clients/windows/target/release/wp1-panes.png
            clients/windows/target/release/wp2-menu.png

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgetty-win
          if-no-files-found: warn
          path: |
            clients/windows/target/release/forgetty-win.exe
            clients/windows/target/release/forgetty.exe
            clients/windows/target/release/*.dll
            clients/windows/target/release/v2-test-server.exe
            clients/windows/target/release/smoke.json
            clients/windows/target/release/smoke.err

  # WP0 to WP3 of docs/architecture/WINDOWS_SERVER.md: the server crates on Windows.
  # CHECK_CRATES must compile (tests and benches too). TEST_CRATES must pass their tests. Both
  # sets grow with each work package. Every server crate is in both sets now.
  server-crates:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CHECK_CRATES: "-p forgetty-core -p forgetty-config -p forgetty-workspace -p forgetty-sync -p forgetty-pty -p forgetty-session -p forgetty-socket -p forgetty-server"
      TEST_CRATES: "-p forgetty-core -p forgetty-config -p forgetty-workspace -p forgetty-sync -p forgetty-pty -p forgetty-session -p forgetty-socket -p forgetty-server"
    steps:
      # Tests compare generated docs and `include_str!` text with the checked-in files: LF only.
      - name: Checkout with LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-crates

      - name: Check the server crates
        shell: pwsh
        run: |
          $crates = $env:CHECK_CRATES -split ' '
          cargo check --locked --all-targets @crates

      - name: Test the server crates
        shell: pwsh
        run: |
          $crates = $env:TEST_CRATES -split ' '
          cargo test --locked --no-fail-fast @crates

  # Server-only latency probe: one key in over protocol v2, its echo out, for a server process
  # at the default 15.6 ms timer ("off"), with timeBeginPeriod only ("period") and with the
  # server's own setting ("full"), next to the same echo through a ConPTY in the test process.
  # The numbers are in the log (lines starting with PROBE).
  timer-probe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout with LF line endings
        shell: bash
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: Swatinem/rust-cache@v2
        with:
          key: server-crates

      - name: Probe
        shell: pwsh
        run: |
          cargo test --locked -p forgetty-server --test timer_probe -- --nocapture --test-threads=1 --include-ignored 2>&1 | Tee-Object probe.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: timer-probe
          path: probe.log

  # The real Linux server, built here, for the WSL end-to-end test below.
  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      # The key carries the Zig CPU policy: a cached target dir from before `-Dcpu=baseline`
      # holds a libghostty-vt built for the CPU of whichever runner built it (SIGILL elsewhere).
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-server-zig-cpu-baseline-1

      - name: Build forgetty (release) and the server tarball
        run: scripts/build-server-dist.sh --target x86_64-unknown-linux-gnu --no-zigbuild --skip-deb --skip-rpm --out dist-out

      # The library that ships must run on any x86-64 CPU: wsl-e2e runs it on another machine
      # than the one that built it. AVX or AVX-512 outside the run-time dispatched code is SIGILL there.
      - name: libghostty-vt has no native-CPU instructions
        run: |
          mkdir -p lib-check
          tar -xzf dist-out/*.tar.gz -C lib-check --wildcards '*/lib/libghostty-vt.so.0'
          so="$(ls lib-check/*/lib/libghostty-vt.so.0)"
          echo "CPU of this runner: $(grep -m1 'model name' /proc/cpuinfo)"; grep -m1 -o 'avx512[a-z]*' /proc/cpuinfo | head -1 || true
          crates/forgetty-vt/scripts/check-no-native-simd.sh "$so"

      # The check must be able to fail. Self-test: sample instructions (AVX, BMI, SSE4, ...) are
      # flagged, baseline and run-time dispatched code is not.
      - name: The CPU check sees native-CPU code (self-test)
        run: crates/forgetty-vt/scripts/check-no-native-simd.sh --self-test

      # aarch64: the same check on a real cross build. Baseline passes. A build for a CPU with
      # SVE, LSE atomics, crypto and dot product (Neoverse V1) must be flagged.
      - name: aarch64 baseline passes and a Neoverse V1 build is flagged
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          cd crates/forgetty-vt/ghostty
          zig build -Demit-lib-vt=true --release=fast -Dtarget=aarch64-linux-gnu.2.28 -Dcpu=baseline -p "$RUNNER_TEMP/a64-base"
          zig build -Demit-lib-vt=true --release=fast -Dtarget=aarch64-linux-gnu.2.28 -Dcpu=neoverse_v1 -p "$RUNNER_TEMP/a64-v1"
          cd "$GITHUB_WORKSPACE"
          crates/forgetty-vt/scripts/check-no-native-simd.sh "$RUNNER_TEMP/a64-base/lib/libghostty-vt.so.0.1.0"
          crates/forgetty-vt/scripts/check-no-native-simd.sh "$RUNNER_TEMP/a64-v1/lib/libghostty-vt.so.0.1.0" --expect-native

      - uses: actions/upload-artifact@v4
        with:
          name: forgetty-server-linux
          path: dist-out/*.tar.gz
          if-no-files-found: error

  # W4: the Windows client against the real `forgetty server run` inside WSL.
  # WSL1 is what a GitHub-hosted Windows runner can run (no nested
  # virtualization). If WSL cannot host the server, the step output says why.
  wsl-e2e:
    needs: [build-and-smoke, linux-server]
    if: ${{ !cancelled() && needs.linux-server.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: forgetty-win
          path: win

      - uses: actions/download-artifact@v4
        with:
          name: forgetty-server-linux
          path: srv

      - uses: Vampire/setup-wsl@v6
        with:
          distribution: Ubuntu-24.04
          wsl-version: 1

      - name: Install the server in WSL
        shell: pwsh
        run: |
          $d = "Ubuntu-24.04"
          wsl --status
          wsl -l -v
          $srv = (Resolve-Path srv).Path -replace '\\','/'
          $u = (wsl -d $d -u root --exec wslpath -u "$srv").Trim()
          wsl -d $d -u root --exec bash -c "set -e; mkdir -p /opt/fg; tar -xzf $u/*.tar.gz -C /opt/fg --strip-components=1; install -m755 /opt/fg/bin/forgetty /usr/local/bin/forgetty; install -m644 /opt/fg/lib/libghostty-vt.so.0 /usr/local/lib/; ldconfig; ldd /usr/local/bin/forgetty | grep -i ghostty; /usr/local/bin/forgetty --version; uname -a; id"

      - name: Smoke against the real server
        shell: pwsh
        working-directory: win
        run: |
          $env:FORGETTY_REAL_WSL_DISTRO = "Ubuntu-24.04"
          $p = Start-Process .\forgetty-win.exe -ArgumentList '--smoke' -Wait -PassThru -RedirectStandardOutput real-smoke.json -RedirectStandardError real-smoke.err
          Get-Content real-smoke.json
          Get-Content real-smoke.err
          $code = $p.ExitCode
          Write-Host "forgetty-win real smoke exit code: $code"
          exit $code

      - name: Server log
        if: always()
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 -u root --exec bash -c 'ls -la /root/.local/share/forgetty/logs 2>&1 | head -20; for f in $(ls -t /root/.local/share/forgetty/logs/* 2>/dev/null | head -3); do echo ==== $f; tail -n 60 $f; done; exit 0'

      - name: Upload real-server smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgetty-win-real
          if-no-files-found: warn
          path: win/real-smoke.json

  # W4: per-user MSI (WiX v4). MSI and not MSIX: an unsigned MSIX needs its
  # certificate trusted machine-wide (admin) or Developer Mode before it
  # installs; a per-user MSI installs with no admin rights and no setup.
  installer:
    needs: build-and-smoke
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: forgetty-win
          path: payload

      - name: Build the MSI (and a newer one for the upgrade test)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $ver = (Select-String -Path clients/windows/Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          Write-Host "version $ver"
          New-Item -ItemType Directory -Force out, out-new | Out-Null
          wix build -arch x64 -d Version=$ver -d Payload=payload clients/windows/installer/Package.wxs -o "out/forgetty-win-$ver-x64.msi"
          # The same files with a higher version: a major upgrade of the first one.
          $v = [version]$ver
          $newver = "$($v.Major).$($v.Minor).$($v.Build + 1)"
          Write-Host "upgrade version $newver"
          wix build -arch x64 -d Version=$newver -d Payload=payload clients/windows/installer/Package.wxs -o "out-new/forgetty-win-$newver-x64.msi"
          Get-ChildItem out, out-new | Format-Table Name, Length

      - name: Turn on the Japanese and Chinese input methods for the smoke
        # Same as in build-and-smoke: the smoke switches to them like the language bar.
        continue-on-error: true
        shell: pwsh
        run: |
          $list = Get-WinUserLanguageList
          foreach ($tag in 'ja-JP', 'zh-Hans-CN') { if (-not ($list | Where-Object LanguageTag -eq $tag)) { $list.Add($tag) } }
          Set-WinUserLanguageList $list -Force

      - name: Install and check
        shell: pwsh
        run: |
          $msi = (Get-ChildItem out/*.msi | Select-Object -First 1).FullName
          # Word Count bit 8 set means "elevated privileges are not required to install".
          $wi = New-Object -ComObject WindowsInstaller.Installer
          $db = $wi.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $wi, @($msi, 0))
          $si = $db.GetType().InvokeMember("SummaryInformation", "GetProperty", $null, $db, @(0))
          $wc = [int]$si.GetType().InvokeMember("Property", "GetProperty", $null, $si, @(15))
          Write-Host "summary word count: $wc"
          if (($wc -band 8) -eq 0) { throw "the package asks for elevation" }
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60; throw "install failed: $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Forgetty"
          foreach ($f in "forgetty-win.exe","forgetty.exe","ghostty-vt.dll") { if (-not (Test-Path (Join-Path $dir $f))) { throw "missing $f" } }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Forgetty.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start menu entry at $lnk" }
          $path = (Get-ItemProperty "HKCU:\Environment").Path
          if ($path -notlike "*$dir*") { throw "install folder is not on the user PATH" }
          if (Test-Path "C:\Program Files\Forgetty") { throw "wrote to Program Files" }
          if (Test-Path "HKLM:\Software\Forgetty") { throw "wrote to HKLM" }
          # The login autostart for the server (design decision 8).
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Forgetty server"
          $want = "`"$dir\forgetty-win.exe`" --start-server"
          if ($run -ne $want) { throw "Run value is '$run', want '$want'" }
          Write-Host "installed to $dir"

      # The installed copy is what users run: it must be the build that was tested, and it must
      # start and pass the same smoke. The smoke writes its screenshots into its working folder,
      # so it runs from a temporary one and leaves the install folder as the MSI made it.
      - name: Smoke the installed copy
        shell: pwsh
        run: |
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Forgetty"
          foreach ($pair in @(@("forgetty-win.exe", "forgetty-win.exe"), @("forgetty.exe", "forgetty.exe"), @("ghostty-vt.dll", "ghostty-vt.dll"))) {
            $got = (Get-FileHash (Join-Path $dir $pair[0]) -Algorithm SHA256).Hash
            $want = (Get-FileHash (Join-Path "payload" $pair[1]) -Algorithm SHA256).Hash
            Write-Host "$($pair[0]): installed $got, tested $want"
            if ($got -ne $want) { throw "the installed $($pair[0]) is not the tested build" }
          }
          $work = Join-Path $env:RUNNER_TEMP "installed-smoke"
          New-Item -ItemType Directory -Force $work | Out-Null
          # The test server is not part of the product: it stays in the payload folder.
          $env:FORGETTY_TEST_SERVER = (Resolve-Path "payload\v2-test-server.exe").Path
          $p = Start-Process (Join-Path $dir "forgetty-win.exe") -ArgumentList '--smoke' -WorkingDirectory $work -Wait -PassThru -RedirectStandardOutput (Join-Path $work "smoke.json") -RedirectStandardError (Join-Path $work "smoke.err")
          Get-Content (Join-Path $work "smoke.json")
          Get-Content (Join-Path $work "smoke.err")
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Join-Path $work "smoke.json") out/installed-smoke.json -ErrorAction SilentlyContinue
          Write-Host "installed forgetty-win --smoke exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "the installed forgetty-win.exe failed its smoke" }
          # forgetty.exe is the CLI, not a copy of the app. A release build cannot lift the refusal
          # to run elevated, and this runner is an administrator: the installed server must say so
          # (exit 78) and must not start. On a runner that is not elevated it would start, so the
          # check is skipped there.
          $cli = Join-Path $dir "forgetty.exe"
          $v = & $cli --version
          if ($LASTEXITCODE -ne 0 -or $v -notmatch "forgetty") { throw "forgetty.exe --version: exit $LASTEXITCODE, '$v'" }
          Write-Host "forgetty.exe --version: $v"
          $admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          if ($admin) {
            $state = Join-Path $env:RUNNER_TEMP "installed-cli-state"
            $ErrorActionPreference = "Continue"
            $out = & $cli --state-dir $state server run 2>&1
            Write-Host "forgetty.exe server run (elevated): exit $LASTEXITCODE, $out"
            if ($LASTEXITCODE -ne 78) { throw "an elevated server run must exit 78, got $LASTEXITCODE" }
            # The Run value runs this. It shows no window and finds forgetty.exe next to itself.
            # Elevated it starts nothing and ends with 0 (the server refuses to run elevated, and
            # a start from an elevated window must not leave one for normal programs).
            $p = Start-Process (Join-Path $dir "forgetty-win.exe") -ArgumentList '--start-server' -Wait -PassThru
            Write-Host "forgetty-win.exe --start-server (elevated): exit $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "--start-server must end with 0 and start nothing when elevated, got $($p.ExitCode)" }
            $started = Get-Process forgetty -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $dir "forgetty.exe") }
            if ($started) { throw "--start-server started a server although it runs elevated" }
            # The step must not end with the exit code of this check.
            $global:LASTEXITCODE = 0
          }
          # Nothing the smoke did may stay in the install folder.
          $extra = Get-ChildItem $dir | Where-Object { $_.Name -notin @("forgetty-win.exe", "forgetty.exe", "ghostty-vt.dll") }
          if ($extra) { throw "the smoke left files in the install folder: $($extra.Name -join ', ')" }

      # An upgrade stops the server (its shells end, the layout is restored at the next start) and
      # replaces the files. The runner is elevated and the server runs at medium integrity, so
      # this is the case where the installer's `forgetty.exe server stop` must cross the levels.
      - name: Upgrade with a running server
        # Independent of the app smoke above: a failed smoke must not hide the installer checks.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          . clients/windows/ci/medium-server.ps1
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Forgetty"
          $exe = Join-Path $dir "forgetty.exe"
          $new = (Get-ChildItem out-new/*.msi | Select-Object -First 1).FullName
          $newver = [IO.Path]::GetFileNameWithoutExtension($new) -replace '^forgetty-win-(.*)-x64$','$1'
          $old = Start-MediumServer $exe
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$new`" /qn /l*v upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content upgrade.log -Tail 80; throw "upgrade failed: $($p.ExitCode)" }
          if (-not (Wait-Gone $old)) { throw "the old server (pid $old) is still running after the upgrade" }
          foreach ($pair in @(@("forgetty-win.exe", "forgetty-win.exe"), @("forgetty.exe", "forgetty.exe"), @("ghostty-vt.dll", "ghostty-vt.dll"))) {
            $got = (Get-FileHash (Join-Path $dir $pair[0]) -Algorithm SHA256).Hash
            $want = (Get-FileHash (Join-Path "payload" $pair[1]) -Algorithm SHA256).Hash
            if ($got -ne $want) { throw "after the upgrade $($pair[0]) is not the tested build" }
          }
          $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run")."Forgetty server"
          $want = "`"$dir\forgetty-win.exe`" --start-server"
          if ($run -ne $want) { throw "after the upgrade the Run value is '$run', want '$want'" }
          # The product version in the Uninstall list is the new one.
          $found = foreach ($root in "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall", "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall") {
            Get-ChildItem $root -ErrorAction SilentlyContinue | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.DisplayName -eq "Forgetty" }
          }
          $found | ForEach-Object { Write-Host "installed product: $($_.DisplayName) $($_.DisplayVersion)" }
          if (-not $found) { throw "no installed product Forgetty in the Uninstall list" }
          if ($found | Where-Object { $_.DisplayVersion -ne $newver }) { throw "the product version is not $newver" }
          Write-Host "upgraded to $newver; the old server (pid $old) was stopped"

      - name: Uninstall and check
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          . clients/windows/ci/medium-server.ps1
          $msi = (Get-ChildItem out-new/*.msi | Select-Object -First 1).FullName
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Forgetty"
          $exe = Join-Path $dir "forgetty.exe"
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Forgetty.lnk"
          # A real server at medium integrity holds forgetty.exe and the DLL while we uninstall.
          $srv = Start-MediumServer $exe
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v uninstall.log" -Wait -PassThru
          # 3010 would mean a restart is needed because a file was in use.
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 60; throw "uninstall failed: $($p.ExitCode)" }
          if (-not (Wait-Gone $srv)) { throw "the server (pid $srv) is still running after the uninstall" }
          if (Test-Path $dir) { throw "install folder left behind" }
          if (Test-Path $lnk) { throw "Start menu entry left behind" }
          if ((Get-ItemProperty "HKCU:\Environment").Path -like "*$dir*") { throw "PATH entry left behind" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue)."Forgetty server") { throw "Run value left behind" }
          Write-Host "install, upgrade and uninstall are clean; the running server was stopped each time"

      # The StartServer custom action (after InstallFinalize) starts the user's server when the
      # installer itself is not elevated. The runner is elevated, so the steps above never see
      # it: this one runs the installer at medium integrity, as a user's own installer does.
      # After msiexec ends, a server must be running, answer on its pipe (asked at medium too),
      # and not be a child that ends with the installer.
      - name: Install at medium integrity starts the server
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          . clients/windows/ci/medium-server.ps1
          $msi = (Get-ChildItem out-new/*.msi | Select-Object -First 1).FullName
          $dir = Join-Path $env:LOCALAPPDATA "Programs\Forgetty"
          $exe = Join-Path $dir "forgetty.exe"
          if (Test-Path $dir) { throw "the install folder is still there before the test" }
          if (Get-ServerPid $exe) { throw "a server is running before the test" }
          $code = [MediumLaunch]::Run("msiexec.exe /i `"$msi`" /qn /l*v `"$PWD\medium-install.log`"", 300000)
          Write-Host "medium install: exit $code"
          if ($code -ne 0) { Get-Content medium-install.log -Tail 80; throw "install at medium integrity failed: $code" }
          # msiexec has ended. The custom action ran forgetty-win.exe --start-server, which starts
          # the server detached and returns.
          $srv = $null
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not $srv) { Start-Sleep -Milliseconds 500; $srv = Get-ServerPid $exe }
          if (-not $srv) { Get-Content medium-install.log -Tail 80; throw "no server after the install" }
          # Not a child that dies with the installer: its parent is not an msiexec, and it is
          # still there some seconds after msiexec ended.
          $parent = (Get-CimInstance Win32_Process -Filter "ProcessId = $srv").ParentProcessId
          $pp = Get-Process -Id $parent -ErrorAction SilentlyContinue
          Write-Host "server pid $srv, parent pid $parent ($($pp.ProcessName))"
          if ($pp -and $pp.ProcessName -eq 'msiexec') { throw "the server is a child of msiexec" }
          Start-Sleep -Seconds 8
          if (-not (Get-Process -Id $srv -ErrorAction SilentlyContinue)) { throw "the server (pid $srv) ended with the installer" }
          # Reachable through its pipe, asked as the user would (medium).
          $out = Join-Path $env:RUNNER_TEMP "medium-status.json"
          Remove-Item $out -ErrorAction SilentlyContinue
          $st = [MediumLaunch]::Run("cmd.exe /d /s /c `"`"$exe`" server status --json > `"$out`" 2>&1`"", 60000)
          $json = Get-Content $out -Raw
          Write-Host "medium 'server status --json': exit $st $json"
          if ($st -ne 0) { throw "the server does not answer on its pipe (exit $st)" }
          $info = $json | ConvertFrom-Json
          if ($info.pid -ne $srv) { throw "the server that answers (pid $($info.pid)) is not the one started (pid $srv)" }
          if (-not $info.port -or -not $info.addresses) { throw "status has no port and addresses: $json" }
          # Clean up as the user: stop the server, uninstall.
          [void][MediumLaunch]::Run("`"$exe`" server stop", 60000)
          if (-not (Wait-Gone $srv)) { throw "the server (pid $srv) did not stop" }
          $code = [MediumLaunch]::Run("msiexec.exe /x `"$msi`" /qn /l*v `"$PWD\medium-uninstall.log`"", 300000)
          if ($code -ne 0) { Get-Content medium-uninstall.log -Tail 60; throw "uninstall at medium integrity failed: $code" }
          Write-Host "the install started a server (pid $srv) that outlived msiexec and answered on its pipe"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forgetty-win-msi
          if-no-files-found: error
          path: |
            out/*.msi
            out-new/*.msi
            out/installed-smoke.json
            install.log
            upgrade.log
            uninstall.log
            medium-install.log
            medium-uninstall.log

  # Can the runner install a Japanese or Chinese IME? Run by hand (workflow_dispatch). Result: it
  # already has Microsoft IME (ja) and Pinyin (zh) and the language packs, so the smoke drives them
  # (`ime_real_*`). This job only reports (ime-probe.json).
  # It does not gate: a hosted runner may refuse language packs, and then the IME checks are the
  # handler-level ones in the smoke plus clients/windows/docs/manual-tests.md.
  ime-probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # A language pack install that hangs ended this job at 45 minutes and held the whole run.
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Try to install ja-JP and zh-CN input methods
        timeout-minutes: 8
        shell: pwsh
        run: ./clients/windows/ci/ime-probe.ps1
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ime-probe
          if-no-files-found: warn
          path: ime-probe.json
