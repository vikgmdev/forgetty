name: windows-client

# V3 Windows client: GPUI app shell + libghostty-vt + ConPTY. Builds clients/windows,
# runs the headless smoke mode (W1 + W2 checks), uploads the exe, DLLs, smoke.json
# and a screenshot of the 4-pane layout.
on:
  push:
    branches: [v3/win-spike]
    paths:
      - "clients/windows/**"
      - "crates/forgetty-vt/**"
      - "crates/forgetty-core/**"
      - ".github/workflows/windows-client.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/windows

      - name: Build (release)
        working-directory: clients/windows
        run: cargo build --release

      - name: Smoke
        shell: pwsh
        working-directory: clients/windows/target/release
        run: |
          Get-ChildItem *.exe, *.dll | Format-Table Name, Length
          .\forgetty-win.exe --smoke | Tee-Object -FilePath smoke.json
          $code = $LASTEXITCODE
          Write-Host "forgetty-win --smoke exit code: $code"
          exit $code

      - name: Frame-rate experiments
        if: always()
        continue-on-error: true
        shell: pwsh
        working-directory: clients/windows/target/release
        run: |
          foreach ($ab in 1,2,3,4) {
            $env:FORGETTY_AB = "$ab"
            Write-Host "AB=$ab"
            $out = .\forgetty-win.exe --smoke 2>$null
            $json = ($out | Where-Object { $_ -like '{*' } | Select-Object -Last 1)
            $o = $json | ConvertFrom-Json
            Write-Host ("AB=$ab key_p50={0} conpty_s={1} frames={2} cpu_p50={3} idle_p50={4}" -f $o.key_to_frame_p50_ms, $o.conpty_drain_s, $o.conpty_frames, $o.frame_cpu_p50_ms, $o.frame_idle_p50_ms)
          }

      - name: Upload layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgetty-win-layout-4pane
          if-no-files-found: warn
          path: clients/windows/target/release/layout-4pane.png

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forgetty-win
          if-no-files-found: warn
          path: |
            clients/windows/target/release/forgetty-win.exe
            clients/windows/target/release/*.dll
            clients/windows/target/release/smoke.json
