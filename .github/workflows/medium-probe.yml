name: medium-probe
# Temporary: checks the medium-integrity launch helper of the installer job in one minute.
on:
  push:
    branches: [v3/win-spike]
    paths:
      - ".github/workflows/medium-probe.yml"
      - "clients/windows/ci/medium-server.ps1"
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          . clients/windows/ci/medium-server.ps1
          whoami /groups | Select-String "Mandatory Label"
          $out = Join-Path $env:RUNNER_TEMP "who.txt"
          $code = [MediumLaunch]::Run("cmd.exe /d /s /c `"whoami /groups > `"$out`" 2>&1`"", 30000)
          Write-Host "exit $code"
          Get-Content $out | Select-String "Mandatory Label"
