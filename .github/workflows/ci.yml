name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # Headless: the default workspace members (server and libraries). No GTK,
  # libadwaita or pkg-config needed (V3 P0, AD-022).
  check:
    name: Check (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: zig-cpu-baseline-1

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p forgetty-server --features qa-tools --all-targets -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Latency budget (release)
        run: cargo test --release -p forgetty-client --test latency

      - name: Build QA tools
        run: cargo build -p forgetty-server --features qa-tools

      - name: Behaviour gate P0 (socket + iroh)
        run: scripts/p0_gate.sh

      - name: Behaviour gate P1 (durability + pairing)
        run: scripts/p1_gate.sh

  # Separate and non-blocking for the headless line: the GTK client is paused
  # (AD-022) but must keep compiling.
  gtk:
    name: GTK client (paused)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: zig-cpu-baseline-1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Check GTK packages
        run: cargo check -p forgetty -p forgetty-gtk  # package `forgetty` is the GTK bin `forgetty-gtk`

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
