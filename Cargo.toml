[workspace]
resolver = "2"
members = [
    "crates/forgetty-core",
    "crates/forgetty-vt",
    "crates/forgetty-pty",
    "crates/forgetty-gtk",
    "crates/forgetty-config",
    "crates/forgetty-watcher",
    "crates/forgetty-workspace",
    "crates/forgetty-socket",
    "crates/forgetty-session",
    "crates/forgetty-sync",
    "crates/forgetty-server",
    "crates/forgetty-proto",
    "crates/forgetty-client",
]

# V3 (AD-022): the GTK client is paused. Default members exclude the root
# `forgetty` GTK package and `forgetty-gtk`, so plain `cargo build/test/clippy`
# needs no GTK/pkg-config. Build the GTK app explicitly with
# `cargo build -p forgetty -p forgetty-server` (bin `forgetty-gtk`).
default-members = [
    "crates/forgetty-core",
    "crates/forgetty-vt",
    "crates/forgetty-pty",
    "crates/forgetty-config",
    "crates/forgetty-watcher",
    "crates/forgetty-workspace",
    "crates/forgetty-socket",
    "crates/forgetty-session",
    "crates/forgetty-sync",
    "crates/forgetty-server",
    "crates/forgetty-proto",
    "crates/forgetty-client",
]

[workspace.package]
version = "0.1.0-beta"
edition = "2021"
license = "MIT"
repository = "https://github.com/vikgmdev/forgetty"
homepage = "https://forgetty.dev"
description = "The AI-first agentic terminal emulator"

[workspace.dependencies]
notify = "7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
arboard = "3"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
git2 = "0.19"
gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_4"] }
gdk-pixbuf = "0.20"
iroh = { version = "0.97", default-features = false, features = ["metrics", "portmapper"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
hostname = "0.4"
rand = "0.9"

[package]
name = "forgetty"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
build = "build.rs"
default-run = "forgetty-gtk"

# GTK client (paused, AD-022). The server and CLI (`forgetty`) live in
# crates/forgetty-server.
[[bin]]
name = "forgetty-gtk"
path = "src/main.rs"

[dependencies]
forgetty-core = { path = "crates/forgetty-core" }
forgetty-config = { path = "crates/forgetty-config" }
forgetty-gtk = { path = "crates/forgetty-gtk" }
forgetty-workspace = { path = "crates/forgetty-workspace" }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }

# Keep dev and test builds small on the single build box: line tables for our
# crates (backtraces still name file:line), no debuginfo for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
