# Separate workspace on purpose: the Windows client spike must not change the
# root Forgetty workspace (AD-022, V3_PLAN 7.1).
[workspace]

[package]
name = "forgetty-win"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Forgetty V3 Windows client spike: GPUI + libghostty-vt + ConPTY"

[[bin]]
name = "forgetty-win"
path = "src/main.rs"

[dependencies]
forgetty-vt = { path = "../../crates/forgetty-vt" }
forgetty-core = { path = "../../crates/forgetty-core" }
forgetty-shell-core = { path = "shell-core" }
# Newest stable Zed release tag at spike time: v1.24.4. See README.md.
gpui = { git = "https://github.com/zed-industries/zed", rev = "aed37547d8543000494fb69101c05daec5891068" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "aed37547d8543000494fb69101c05daec5891068" }
portable-pty = "0.9"
async-channel = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"

# Zed patches crates.io crates in its own workspace root. Patches do not apply
# to dependents, so the ones gpui needs are repeated here (same revs as v1.24.4).
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.release]
debug = "line-tables-only"
