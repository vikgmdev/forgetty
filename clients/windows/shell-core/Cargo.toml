[package]
name = "forgetty-shell-core"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Forgetty app-shell core: layout model, SessionBackend trait, LocalBackend (ConPTY), keymap, fuzzy search. No UI code."

[dependencies]
forgetty-core = { path = "../../../crates/forgetty-core" }
forgetty-config = { path = "../../../crates/forgetty-config" }
toml = "0.8"
toml_edit = "0.22"
notify = "7"
portable-pty = "0.9"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# Tests that run the pure code against real libghostty rows.
forgetty-vt = { path = "../../../crates/forgetty-vt" }
tempfile = "3"
