[package]
name = "forgetty-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forgetty protocol v2 client: connect, resume, reconnect, pairing (no UI)"

[features]
default = ["link-watch"]
# Treat a change of iroh's network report (UDP families, public addresses) as
# a hint that the link changed: it wakes the liveness check and cuts a backoff
# sleep. iroh has no public link-change event; this reads the doc-hidden
# `Endpoint::net_report`, which can move between iroh releases (hence the
# exact pin of iroh in the workspace). Off: only the app's `network_changed`.
link-watch = []
# In-process protocol v2 test server (`forgetty_client::test_server`).
test-util = []

[[bin]]
name = "v2-test-server"
path = "src/bin/v2-test-server.rs"
required-features = ["test-util"]

[dependencies]
forgetty-proto = { path = "../forgetty-proto" }
forgetty-core = { path = "../forgetty-core" }
iroh = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Turns on the `test-util` feature for the integration tests.
forgetty-client = { path = ".", features = ["test-util"] }
tracing-subscriber = { workspace = true }
forgetty-vt = { path = "../forgetty-vt" }
serde_json = { workspace = true }
tempfile = "3"
base64 = "0.22"
libc = "0.2"
