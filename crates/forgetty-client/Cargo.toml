[package]
name = "forgetty-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forgetty protocol v2 client: connect, resume, reconnect, pairing (no UI)"

[features]
default = []
# In-process protocol v2 test server (`forgetty_client::test_server`).
test-util = []

[[bin]]
name = "v2-test-server"
path = "src/bin/v2-test-server.rs"
required-features = ["test-util"]

[dependencies]
forgetty-proto = { path = "../forgetty-proto" }
forgetty-core = { path = "../forgetty-core" }
iroh = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
# Turns on the `test-util` feature for the integration tests.
forgetty-client = { path = ".", features = ["test-util"] }
tracing-subscriber = { workspace = true }
forgetty-vt = { path = "../forgetty-vt" }
serde_json = { workspace = true }
tempfile = "3"
base64 = "0.22"
libc = "0.2"
