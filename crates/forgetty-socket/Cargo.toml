[package]
name = "forgetty-socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test-only extension hook for the protocol harness. Never in release builds.
qa-tools = []

[dependencies]
forgetty-core = { path = "../forgetty-core" }
forgetty-pty = { path = "../forgetty-pty" }
forgetty-session = { path = "../forgetty-session" }
forgetty-sync = { path = "../forgetty-sync" }
forgetty-workspace = { path = "../forgetty-workspace" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
bytes = "1"
uuid = { workspace = true }
hostname = "0.4"
libc = "0.2"
schemars = { version = "1", features = ["uuid1"] }

[dev-dependencies]
jsonschema = { version = "0.59", default-features = false }
tokio = { workspace = true }
tempfile = "3"
